name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Verify dependency lock
        run: uv lock --check

      # Full dependency set, but no model weights or provider calls: heavy
      # components stay lazy and the release verifier is pure/offline.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Audit Python security
        run: |
          uv run bandit -r src scripts -ll
          uv run pip-audit --local \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290

      - name: Verify release evidence and public boundary
        run: uv run python scripts/verify_release.py

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build --out-dir dist

      - name: Smoke-test package, CLI, and FastAPI import
        run: |
          uv run pytest tests/test_packaging.py -q
          uv run python -W error::UserWarning -c "import sys; sys.path.insert(0, 'src'); import rag.api.main; print('FastAPI import: ok')"
          uv run python -W error::UserWarning scripts/ask.py --help
